# ~/.tmux.conf

# Noctalia Theme
source-file -q "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"
source-file -q "$XDG_CONFIG_HOME/tmux/themes/bar.conf"

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay (tmux 3.5+ defaults to 10ms, but 0 is safe for compatibility)
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support (scroll, select, resize)
set -g mouse on

# Enable focus events for apps like vim/neovim
set -g focus-events on

# Set terminal with true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Status bar position
set -g status-position top

# ============================================
# KEY BINDINGS
# ============================================

# Reload config with 'r'
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" && tmux display-message "Config reloaded!"'

# Better pane splitting (keeps current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# x kill pane without confirmation
bind x kill-pane

# ============================================
# COPY 
# ============================================

# Use vi keys in copy mode
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Clipboard sync
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"' \
  'if-shell "command -v xclip >/dev/null 2>&1" \
    "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\"xclip -selection clipboard\\"" \

